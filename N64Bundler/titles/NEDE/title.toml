# The gaps in this cartridge's other five dispatch tables.
#
# The geo-layout interpreter works the way the behaviour one does, and so do
# four smaller tables. Each is a run of consecutive words that all point into
# the code, and in each the walk had already recovered between 78% and 97% of
# the entries -- which is what makes the rest safe to name: a run that is
# nearly all known function starts is a table of function pointers, whereas a
# `switch` jump table, which looks the same from a distance, has none of its
# entries recovered because they are labels inside a function. Every address
# below begins with a prologue or a load, and every one of them sits after
# another function's last instruction.

