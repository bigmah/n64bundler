# The ten entries of the behaviour-command table at 0x8025E75C that no `jal`
# points at.
#
# Mario Builder 64 runs each object through an interpreter whose whole body is
# `handler = table[*script++]; handler();`, so the sixty-five handlers are
# reachable only through that table and the walk has no reason to split the
# function each one sits inside. Fifty-five of them are called directly from
# somewhere else as well and were recovered; these ten were not, and each one
# swallowed by its neighbour is a behaviour command the game cannot run.
#
# A table of code pointers is not enough on its own to name a function: a
# `switch` compiles to one too, and its entries are labels inside a function
# rather than functions. Measured on this cartridge, the two kinds are not
# cleanly separable -- the real tables are 76% to 94% preceded by a return and
# the switch tables reach 58% -- so this stays a record rather than a rule.
[[function]]
vram = 0x801B848C

