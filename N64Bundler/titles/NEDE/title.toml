#
# Mario Builder 64 - what following calls cannot find.
#
# Measurements of a cartridge: addresses and a hash. No game data.
#
# A function nothing calls directly is invisible to this analysis: the game
# reaches it through a table, so no `jal` points at it and neither the walk nor
# the sweep has any reason to split the function it sits inside. The first sign
# of one is the runtime failing an indirect call to an address that was never
# recovered, and the address it names is the line to add here.

[title]
game_id = "NEDE"
name = "Mario Builder 64"
rom_hash = "d82b295c5a4d30f5"
notes = [
    "boots as far as an indirect call into a segment this record does not yet describe; see PLAN.md",
]

[[section]]
name = "main"
rom  = 0x0258E0
vram = 0x8014C2E0
size = 0x118460

# The code Mario Builder 64 loads to the top of RAM.
#
# Its objects are described by behaviour scripts rather than compiled in, and
# one of the script commands loads a segment of machine code: `0x16`, four
# words, the ram address followed by the segment's rom start and end. Five
# scripts issue it and all five name the same segment, so the game has exactly
# one of these and it lands at 0x807FF3A0, immediately under the top of an
# expanded 8MB console. The geo layouts the same scripts build then call into
# it, which is how a game that had recompiled cleanly could still stop on an
# indirect call to an address in nothing the analysis had ever seen.
[[section]]
name = "objects"
rom  = 0x25BC84
vram = 0x807FF3A0
size = 0x000C40

# Functions nothing calls directly, found by running the game with
# `n64b-port --trace` and reading the address the runtime could not resolve out
# of the last few hundred entries the host printed. Each one moved the game a
# little further into its own code; the fifth got it to its render loop.
# Mario Builder 64 reads its controllers by driving the serial interface
# itself rather than through libultra's `osContStartReadData`, so librecomp has
# nothing to substitute and the game blocks forever on an interrupt that never
# comes. The signature database has this function from a build 4 bytes shorter,
# which is near enough to be sure and not near enough to match, so it is named
# here. ModernReality supplies the implementation.
[[function]]
vram = 0x80132A90
name = "__osSiRawStartDma"

[[function]]
vram = 0x80124FC0


