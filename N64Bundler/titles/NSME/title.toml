# SPDX-License-Identifier: GPL-3.0-or-later
#
# Super Mario 64 (USA) - what n64rip cannot recover from the image on its own.
#
# Measurements of a cartridge: two ROM offsets, two load addresses, two sizes
# and a hash. No game data, the same rule the ROMs themselves follow.
#
# Super Mario 64 loads two code segments beyond the megabyte IPL3 copies, and
# it addresses both through linker symbols rather than through a DMA table --
# `load_engine_code_segment()` is a call with `_engineSegmentRomStart` in a
# register, and there is nothing in the image that says what that was. So the
# analyser finds neither, and without them 1,207 of the game's calls leave
# every section it recovered.
#
# How the numbers were found, so they can be checked: collect every `jal`
# target in the boot segment that lands outside it, then search the ROM for the
# offset at which those targets fall on function prologues. Both segments have
# exactly one such offset.

[title]
game_id = "NSME"
name = "Super Mario 64"
rom_hash = "8a90daa33e09a265"
# The cartridge has a 4kbit EEPROM. Without this the analyser says allow_all,
# which works but reports the larger 16kbit chip to the game.
save_type = "eep4k"
notes = [
    "the engine and goddard segments are addressed through linker symbols, so nothing in the image points at them",
]

# The engine: math_util, surface_collision, behavior_script, graph_node, and
# the rest of what every level calls into. Copied to the top of the main pool
# at boot. This is where nearly all of the missing calls go.
[[section]]
name = "engine"
rom  = 0x0F5580
vram = 0x80378800
size = 0x13200

# libgoddard, the Mario head on the file select screen. Its own little 3D
# engine, and the only part of the game that uses it.
[[section]]
name = "goddard"
rom  = 0x21F4C0
vram = 0x8016F000
size = 0x60000

# The libultra functions that drive the hardware, which the signature database
# cannot reach.
#
# The database was built from Mario Builder 64's `libultra.a`, a much later SDK
# revision than the one this cartridge was linked against, so the twenty
# functions it names here are the ones that happen not to have changed between
# them -- threads, message queues, caches, the task interface. What changed is
# every device driver, and those are exactly the ones that matter: unnamed,
# they run as recompiled MIPS writing to hardware registers that the host backs
# with zeroed pages, so the write is discarded and the device never does
# anything.
#
# Each one below was identified from the disassembly rather than guessed, and
# the evidence is written next to it. The runtime implements all of them.

# Sets a message's type to 11 or 12 -- OS_MESG_TYPE_DMAREAD and DMAWRITE -- by
# the direction it was passed, fills in the rest of an OSIoMesg, and hands it
# to the PI manager's queue, returning -1 if that manager was never started.
# Every cartridge read in the game goes through it.
[[function]]
vram = 0x80324460
name = "osPiStartDma"

# Sets the queue and message for an event, indexing a table of eight-byte
# entries by the event number.
[[function]]
vram = 0x803225D0
name = "osSetEventMesg"

# Three arguments, and it writes all three into the video interface's pending
# context -- queue, message, retrace count.
[[function]]
vram = 0x80322640
name = "osViSetEvent"

# Creates a thread and a queue, registers an event, and calls the routine that
# writes the video registers. The video manager.
[[function]]
vram = 0x80322F70
name = "osCreateViManager"

# Stores its argument at offset 8 of the pending context -- the mode pointer --
# and sets the context's state to 1.
[[function]]
vram = 0x803232D0
name = "osViSetMode"

# Takes a byte, which is the only libultra video call that does.
[[function]]
vram = 0x80323340
name = "osViBlack"

# Tests its argument against 1, which is OS_VI_GAMMA_ON, the first of the
# feature bits.
[[function]]
vram = 0x803233B0
name = "osViSetSpecialFeatures"

# Stores its argument at offset 4 of the pending context -- the framebuffer --
# and ors 0x10 into the state, which is the bit meaning an address was set.
# This is the call the renderer needs: it is what hands over the frame.
[[function]]
vram = 0x80323A00
name = "osViSwapBuffer"

# Halts the signal processor, waits for it to say so, and DMAs a task's
# microcode and data into its memory. Unnamed it spins forever: the halt bit it
# waits for lives in a register the host backs with zeroed pages, and zero
# there means "still running".
[[function]]
vram = 0x80322A5C
name = "osSpTaskLoad"

# The serial interface: the controllers and the save chip.
#
# Everything below reaches the console through the SI, and every one of them
# ends in the same place -- a PIF request handed to the hardware, then a block
# on the message queue the SI interrupt would have posted to. There is no SI
# and there is no interrupt, so unnamed each of these is where the game stops
# for good. This is what Super Mario 64 was doing when its screen stayed black:
# the game loop thread reached `init_controllers` and never came back out.

# Guarded by a one-shot flag it sets on entry, reads the counter, and if less
# than 500000 -- the half-second libultra waits for the controllers to settle
# after a cold boot -- sets a timer and blocks. Then it packs a PIF request and
# hands it to the serial interface. Three arguments: a queue, a bit pattern,
# and an array of status words.
[[function]]
vram = 0x80323CC0
name = "osContInit"

# Takes the access semaphore, packs a read request unless the last poll already
# was one, starts the serial DMA, and blocks on the caller's queue. This is
# every frame's controller read.
[[function]]
vram = 0x80323A60
name = "osContStartReadData"

# Unpacks the 64 bytes the PIF sent back into an OSContPad each: the button
# halfword, then the stick's two signed bytes, and the receive-size nibbles
# turned into the error byte.
[[function]]
vram = 0x80323B24
name = "osContGetReadData"

# Takes the access semaphore, asks the save chip for its status, and reports
# whether the answer had bit 0x8000 set -- which is how libultra says "there is
# an EEPROM here". Super Mario 64 keeps the result in a byte it consults before
# every save, so an unnamed one is a game that cannot write a file even once
# the block is gone.
[[function]]
vram = 0x80324080
name = "osEepromProbe"

# The pair that reads and writes a run of bytes across block boundaries. Both
# reject an address of 64 or more -- the 4kbit chip's block count -- and then
# loop over the single-block call. They differ only in which one they loop.
[[function]]
vram = 0x80324690
name = "osEepromLongRead"

[[function]]
vram = 0x803247D0
name = "osEepromLongWrite"

# The single-block calls the two above loop over. Nothing in the game calls
# them directly; they are named so that the pair's own callers inside libultra
# cannot reach the hardware either.
[[function]]
vram = 0x80329150
name = "osEepromRead"

[[function]]
vram = 0x80328AF0
name = "osEepromWrite"

# Writes the DRAM address and the PIF read or write register, having first
# asked whether the device is busy. Mario Builder 64 needed this one by name
# for the same reason; Super Mario 64 reaches it through the four calls above,
# so naming those is enough -- but a game that drives the SI itself would not,
# and it costs nothing to be sure.
[[function]]
vram = 0x80328960
name = "__osSiRawStartDma"

# The audio interface.
#
# Writes the DAC rate and bit rate registers from a frequency, and turns the
# interface on. Called once, from the audio thread's initialisation.
[[function]]
vram = 0x80325970
name = "osAiSetFrequency"

# Writes a physical address and a length to the audio interface, having checked
# the status register for room. This is the call that would hand a frame of
# samples to the console's DAC, and the one the host has to see to play any.
[[function]]
vram = 0x80325DB0
name = "osAiSetNextBuffer"

# Reads the audio interface's status register and returns it. Three
# instructions, but with a stack frame, so `n64sig`'s short-function rule
# does not reach it and neither does its tiny-accessor list.
[[function]]
vram = 0x80329750
name = "osAiGetStatus"

# The rest of the console's devices.
#
# Starts the thread that serialises cartridge access. `osPiStartDma` returns -1
# when it was never started, and every cartridge read in the game goes through
# `osPiStartDma`. Named by its call site: `thread1_idle` calls it with priority
# 150, a queue, a buffer and a count of 32, which is the manager's signature
# exactly.
[[function]]
vram = 0x80323570
name = "osCreatePiManager"

# Reads the signal processor's status, reports whether the task yielded, and
# folds that answer back into the task's own flags word. The game asks after
# every graphics task.
[[function]]
vram = 0x80322D70
name = "osSpTaskYielded"

# Walks all thirty-two TLB entries writing an unmapped one over each. Nothing
# here maps the TLB, so the runtime's version is the no-op it should be; the
# reason to name it is that unnamed it is stubbed for its COP0, and a stub
# returns whatever was in v0.
[[function]]
vram = 0x803224A0
name = "osUnmapTLBAll"
